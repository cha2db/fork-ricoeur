name: Cha2db prior-art search comparison
on:
  push:
    branches: [main]
    paths:
      - '_dev/prior_art_bench.py'
      - '_dev/vector_prior.py'
      - '_dev/relations_prior.py'
      - '_dev/build_prior_base.py'
      - '_dev/trigram_prior.py'
      - '_dev/sqlite_vector_prior.py'
      - '_dev/corpus.py'
      - '.github/workflows/prior-art.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cha2db-prior-art-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reusable existing algorithms
        run: |
          python -m pip install -e .
          python -m pip install 'rapidfuzz>=3,<4' 'scikit-learn>=1.5,<2' 'networkx>=3,<4' 'rank-bm25>=0.2,<1'
      - name: FTS5 availability
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.execute('CREATE VIRTUAL TABLE t USING fts5(body)')
          print('SQLite FTS5 PASS',sqlite3.sqlite_version)
          PY
      - name: Materialize one shared 40k SQLite corpus
        run: |
          mkdir -p _dev/results
          python -u _dev/build_prior_base.py --conversations 1000 --messages 40 --output _dev/results/prior-base.sqlite > _dev/results/prior-base.log 2>&1
          cat _dev/results/prior-base.manifest.json
      - name: Compare algorithms on shared SQLite corpus
        run: |
          mkdir -p _dev/results
          python -u _dev/prior_art_bench.py --db-path _dev/results/prior-base.sqlite --conversations 1000 --messages 40 --output _dev/results/prior-art.json > _dev/results/prior-art.log 2>&1 || {
            tail -n 100 _dev/results/prior-art.log
            exit 1
          }
          tail -n 80 _dev/results/prior-art.log
      - name: Compare sqlite-vec against brute-force nearest neighbors
        run: |
          python -m pip install 'sqlite-vec==0.1.9'
          python -u _dev/vector_prior.py --db-path _dev/results/prior-base.sqlite --conversations 1000 --output _dev/results/sqlite-vec.json > _dev/results/sqlite-vec.log 2>&1 || {
            tail -n 100 _dev/results/sqlite-vec.log
            exit 1
          }
          tail -n 40 _dev/results/sqlite-vec.log
      - name: Evaluate cross-chat explicit provenance graph
        run: |
          python -u _dev/relations_prior.py --db-path _dev/results/prior-base.sqlite --output _dev/results/relations.json > _dev/results/relations.log 2>&1 || {
            tail -n 80 _dev/results/relations.log
            exit 1
          }
          cat _dev/results/relations.json
      - name: Compare FTS5 trigram substrings to literal LIKE
        run: |
          python -u _dev/trigram_prior.py --db-path _dev/results/prior-base.sqlite --output _dev/results/trigram.json > _dev/results/trigram.log 2>&1 || {
            tail -n 100 _dev/results/trigram.log
            exit 1
          }
          cat _dev/results/trigram.json
      - name: Probe SQLite-Vector extension and quantized search
        run: |
          set +e
          python -m pip install 'sqlite-vector' > _dev/results/sqlite-vector-install.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            python -u _dev/sqlite_vector_prior.py --db-path _dev/results/prior-base.sqlite --output _dev/results/sqlite-vector.json > _dev/results/sqlite-vector.log 2>&1
            test_status=$?
          else
            test_status=$install_status
          fi
          set -e
          if [ "$test_status" -ne 0 ]; then
            python - <<'PY'
          import json,pathlib
          logs={}
          for name in ('sqlite-vector-install.log','sqlite-vector.log'):
              p=pathlib.Path('_dev/results')/name
              if p.exists():logs[name]=p.read_text(errors='replace')[-3000:]
          pathlib.Path('_dev/results/sqlite-vector.json').write_text(json.dumps({
              'status':'BLOCKED','candidate':'sqlite-vector',
              'reason':'install or runtime failed; see log tails','logs':logs},indent=2))
          PY
          fi
          cat _dev/results/sqlite-vector.json
      - name: Probe availability of official SQLite vec1 extension
        run: |
          python - <<'PY'
          import json,sqlite3,pathlib
          c=sqlite3.connect(':memory:')
          try:
              c.execute('CREATE VIRTUAL TABLE vec1_probe USING vec1(vector)')
              status='AVAILABLE'
          except sqlite3.OperationalError as error:
              status='UNAVAILABLE_ON_STOCK_RUNNER'
              detail=str(error)
          report={'status':status,'candidate':'SQLite official vec1',
                  'detail':detail if status!='AVAILABLE' else 'vec1 module loaded',
                  'note':'Requires an external compiled extension; not bundled into stock SQLite.'}
          p=pathlib.Path('_dev/results/vec1-probe.json')
          p.write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload reproducible logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prior-art-comparison-${{ github.run_id }}
          path: _dev/results/
          retention-days: 30
      - name: Publish connector-readable report
        if: always()
        run: bash _dev/publish_prior_art.sh
