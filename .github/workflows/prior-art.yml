name: Cha2db prior-art search comparison
on:
  push:
    branches: [main]
    paths:
      - '_dev/prior_art_bench.py'
      - '_dev/corpus.py'
      - '_dev/publish_prior_art.sh'
      - '.github/workflows/prior-art.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cha2db-prior-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reusable existing algorithms
        run: |
          python -m pip install -e .
          python -m pip install 'rapidfuzz>=3,<4' 'scikit-learn>=1.5,<2' 'networkx>=3,<4' 'rank-bm25>=0.2,<1'
      - name: FTS5 availability
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.execute('CREATE VIRTUAL TABLE t USING fts5(body)')
          print('SQLite FTS5 PASS',sqlite3.sqlite_version)
          PY
      - name: Rebuild existing corpus and compare algorithms
        run: |
          mkdir -p _dev/results
          python -u _dev/prior_art_bench.py --conversations 1000 --messages 40 --output _dev/results/prior-art.json > _dev/results/prior-art.log 2>&1 || {
            tail -n 100 _dev/results/prior-art.log
            exit 1
          }
          tail -n 80 _dev/results/prior-art.log
      - name: Upload reproducible logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prior-art-comparison-${{ github.run_id }}
          path: _dev/results/
          retention-days: 30
      - name: Publish connector-readable report
        if: always()
        run: bash _dev/publish_prior_art.sh
