name: Phase2 P0 integrity and retrieval fixes
on:
  push:
    branches: [fix/phase2-integrity-p0-20261111]
    paths:
      - 'src/ricoeur/**'
      - '_dev/tests/phase2/**'
      - '.github/workflows/phase2-fix-p0.yml'
  pull_request:
    paths:
      - 'src/ricoeur/**'
      - '_dev/tests/phase2/**'
      - '.github/workflows/phase2-fix-p0.yml'
  workflow_dispatch:
jobs:
  phase2-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install baseline package
        run: python -m pip install -q -e .
      - name: Verify syntax
        run: python -m compileall -q src/ricoeur _dev/tests/phase2
      - name: P0 - strict read-only + bounded context window
        run: python _dev/tests/phase2/test_fix001_readonly_retrieval.py
      - name: P0 - provider and message source identity
        run: python _dev/tests/phase2/test_fix002_source_identity.py
      - name: P0 - all ChatGPT branches and v2 migration
        run: python _dev/tests/phase2/test_fix003_branch_projection.py
      - name: P1 - partial import receipts, origin hash and resumed data
        run: python _dev/tests/phase2/test_fix004_import_receipts.py
      - name: Existing message retrieval contract
        run: python _dev/teste6.py
