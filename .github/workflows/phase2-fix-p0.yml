name: Phase2 P0 integrity and retrieval fixes
on:
  push:
    branches: [fix/phase2-integrity-p0-20261111]
    paths:
      - 'src/ricoeur/**'
      - '_dev/tests/phase2/**'
      - 'docs/phase2/**'
      - '.github/workflows/phase2-fix-p0.yml'
  pull_request:
    paths:
      - 'src/ricoeur/**'
      - '_dev/tests/phase2/**'
      - 'docs/phase2/**'
      - '.github/workflows/phase2-fix-p0.yml'
  workflow_dispatch:
jobs:
  phase2-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install baseline package
        run: python -m pip install -q -e .
      - name: Verify syntax
        run: python -m compileall -q src/ricoeur _dev/tests/phase2
      - name: Prepare isolated Phase2 evidence category
        run: mkdir -p _dev/results/phase2
      - name: P0 - strict read-only + bounded context window
        run: python _dev/tests/phase2/test_fix001_readonly_retrieval.py | tee _dev/results/phase2/fix001.log
      - name: P0 - provider and message source identity
        run: python _dev/tests/phase2/test_fix002_source_identity.py | tee _dev/results/phase2/fix002.log
      - name: P0 - all ChatGPT branches and v2 migration
        run: python _dev/tests/phase2/test_fix003_branch_projection.py | tee _dev/results/phase2/fix003.log
      - name: P1 - partial import receipts, origin hash and resumed data
        run: python _dev/tests/phase2/test_fix004_import_receipts.py | tee _dev/results/phase2/fix004.log
      - name: P1 - FTS5 integrity using only disposable SQLite snapshot
        run: python _dev/tests/phase2/test_fix005_fts_snapshot.py | tee _dev/results/phase2/fix005.log
      - name: Existing message retrieval contract
        run: python _dev/teste6.py | tee _dev/results/phase2/existing-retrieval.log
      - name: Generate reproducible gate receipt
        if: success()
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          root=pathlib.Path("_dev/results/phase2")
          (root/"fix-gates.json").write_text(json.dumps({
            "schema_version":"cha2db.phase2.fix-gates.v1",
            "status":"PASS",
            "commit":os.environ.get("GITHUB_SHA"),
            "run_id":os.environ.get("GITHUB_RUN_ID"),
            "generated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "scenarios":["fix001","fix002","fix003","fix004","fix005","existing-retrieval"],
            "data_policy":"synthetic_only",
            "merge_policy":"peer_review_required",
          },indent=2))
          PY
      - name: Preserve Phase2 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-integrity-fix-${{ github.run_id }}
          path: _dev/results/phase2/
          retention-days: 30
