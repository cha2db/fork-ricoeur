name: Cha2db headless search gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      conversations:
        description: "Benchmark conversations (1..10000)"
        required: false
        default: "300"
      messages:
        description: "Messages per conversation (4..100)"
        required: false
        default: "40"
permissions:
  contents: write
jobs:
  search-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project (core only)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Check SQLite FTS5
        run: |
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect(":memory:")
          c.execute("CREATE VIRTUAL TABLE x USING fts5(content)")
          print("SQLite",sqlite3.sqlite_version,"FTS5 OK")
          PY
      - name: Execute independent retrieval and search gates
        env:
          CONVERSATIONS: ${{ github.event.inputs.conversations || '300' }}
          MESSAGES: ${{ github.event.inputs.messages || '40' }}
        run: |
          mkdir -p _dev/results
          bash _dev/busca.sh
      - name: Compare equivalent SQL queries at 40k messages
        run: |
          mkdir -p _dev/results
          .venv/bin/python -u _dev/scale.py --conversations 1000 --messages 40 --output _dev/results/scale-40k.json > _dev/results/scale-40k.log 2>&1 || {
            cat _dev/results/scale-40k.log
            exit 1
          }
          cat _dev/results/scale-40k.json
      - name: Progressive FTS5 scale and consistency to 2M
        if: matrix.python-version == '3.13'
        run: |
          set +e
          timeout 360s .venv/bin/python -u _dev/autoscale.py --budget-seconds 300 --output _dev/results/autoscale.json > _dev/results/autoscale.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            .venv/bin/python - <<'PY'
          import json,pathlib
          p=pathlib.Path("_dev/results/autoscale.json")
          report=json.loads(p.read_text()) if p.exists() else {"stages":[]}
          report["status"]="LIMIT"
          report["verdict"]="runner_timeout_360s"
          report["max_verified_messages"]=max((s["messages"] for s in report["stages"]),default=0)
          p.write_text(json.dumps(report,indent=2))
          PY
          elif [ "$status" -ne 0 ]; then
            echo "Auto-scale correctness/runtime failure"; cat _dev/results/autoscale.log
            exit "$status"
          fi
          tail -n 10 _dev/results/autoscale.log
      - name: MCP end-to-end contract after core gates
        if: matrix.python-version == '3.13'
        run: |
          .venv/bin/python -m pip install 'mcp==1.9.4' 'pydantic==2.10.6' > _dev/results/mcp-install.log 2>&1 || {
            tail -n 50 _dev/results/mcp-install.log
            exit 1
          }
          .venv/bin/python -u _dev/teste7.py > _dev/results/teste7.log 2>&1 || {
            cat _dev/results/teste7.log
            exit 1
          }
          cat _dev/results/teste7.json
      - name: Upload logs and benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-reports-py${{ matrix.python-version }}
          path: _dev/results/
          retention-days: 30
      - name: Publish connector-readable CI reports
        if: always() && matrix.python-version == '3.13'
        run: bash _dev/publish_ci.sh
