name: Cha2db Phase2 CTK branch-preservation importer gate
on:
  push:
    branches: [main]
    paths:
      - '_dev/phase2_ctk_import.py'
      - '_dev/phase2_import_candidate.py'
      - '.github/workflows/phase2-ctk-import.yml'
  workflow_dispatch:
concurrency:
  group: cha2db-phase2-ctk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate-untrusted-ctk:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Clone upstream with read-only CI credentials
        run: |
          mkdir -p _dev/results
          git clone --depth 1 https://github.com/queelius/ctk.git /tmp/ctk > _dev/results/phase2-ctk-install.log 2>&1
          git -C /tmp/ctk rev-parse HEAD > _dev/results/ctk-upstream-commit.txt
      - name: Install parser and core dependencies, not full TUI/LLM
        run: |
          python -m pip install --no-deps -e /tmp/ctk >> _dev/results/phase2-ctk-install.log 2>&1
          python -m pip install 'pydantic>=2,<3' 'sqlalchemy>=2,<3' 'rich>=13,<16' >> _dev/results/phase2-ctk-install.log 2>&1
      - name: Check OpenAI tree import and sibling preservation
        run: |
          PYTHONPATH=_dev python -u _dev/phase2_ctk_import.py --output _dev/results/phase2-ctk.json > _dev/results/phase2-ctk.log 2>&1 || {
            tail -n 120 _dev/results/phase2-ctk.log
            exit 1
          }
          cat _dev/results/phase2-ctk.json
      - name: Capture every log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-ctk-evidence
          path: _dev/results/
          retention-days: 30
  publish-only-trusted-source:
    needs: evaluate-untrusted-ctk
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase2-ctk-evidence
          path: _dev/results/
      - name: Archive validated report, no source code
        if: always()
        run: bash _dev/publish_phase2.sh ctk
