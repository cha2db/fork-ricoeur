<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cha2db UX Lab</title>
<style>body{font:16px system-ui;background:#111827;color:#eef2ff;margin:0}header{padding:16px;background:#1f2937}main{display:grid;grid-template-columns:minmax(220px,30%) 1fr;gap:12px;padding:12px}section{background:#1f2937;padding:14px;border-radius:12px;min-width:0}input,button{font:inherit;padding:9px;border-radius:7px}button{cursor:pointer;margin:3px;background:#374151;color:white;border:1px solid #6b7280}input{width:65%;background:#111827;color:white;border:1px solid #6b7280}article{white-space:pre-wrap;border-bottom:1px solid #374151;padding:10px 0;overflow-wrap:anywhere}small{color:#cbd5e1}#graph{width:100%;height:360px;border:1px solid #6b7280}a{color:#93c5fd}@media(max-width:700px){main{display:block}section{margin-bottom:12px}}</style>
<header><strong>Cha2db · UX Lab</strong> <small>mesma base SQLite · portas independentes · grafo de coocorrência, não inferência</small></header>
<main><section><label for="q">Busca literal</label><p><input id="q" placeholder="assunto"><button id="find">Buscar</button></p><button id="recent">Recentes</button><button id="network">Grafo</button><div id="results"></div></section><section><div id="detail">Selecione uma conversa.</div><svg id="graph" viewBox="0 0 600 360" role="img" aria-label="Grafo de resultados" hidden></svg><div id="graphlist"></div></section></main>
<script>
const $=id=>document.getElementById(id);
async function api(action,args={}){let u=new URL('/api',location.href);u.searchParams.set('action',action);for(let [k,v] of Object.entries(args))u.searchParams.set(k,v);let r=await fetch(u);let j=await r.json();if(j.status!=='ok')throw Error(j.errors.join('; '));return j.data}
function el(tag,txt,parent){let e=document.createElement(tag);e.textContent=txt;parent.append(e);return e}
async function show(id){$('graph').hidden=true;$('graphlist').replaceChildren();let d=await api('transcript',{id});$('detail').replaceChildren();el('h2',d.conversation.title||id,$('detail'));for(let m of d.messages){let a=el('article',m.role+' · '+(m.timestamp||'unknown')+'\n'+(m.content||''),$('detail'));a.id='m-'+m.id}}
async function list(query=''){let d=await api('conversations',{query});$('results').replaceChildren();for(let c of d){let b=el('button',(c.title||c.id)+' · '+c.platform,$('results'));b.style.display='block';b.onclick=()=>show(c.id)}}
async function network(){let d=await api('graph',{query:$('q').value});$('detail').replaceChildren();el('h2','Relações: resultados da mesma consulta',$('detail'));let svg=$('graph');svg.replaceChildren();svg.hidden=false;$('graphlist').replaceChildren();let n=d.nodes.slice(0,24),pos=new Map(n.map((x,i)=>[x.id,[300+130*Math.cos(i*2*Math.PI/n.length),180+130*Math.sin(i*2*Math.PI/n.length)]]));let ns='http://www.w3.org/2000/svg';for(let e of d.edges){if(!pos.has(e.source)||!pos.has(e.target))continue;let l=document.createElementNS(ns,'line');let a=pos.get(e.source),b=pos.get(e.target);l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);l.setAttribute('stroke','#64748b');svg.append(l)}for(let c of n){let [x,y]=pos.get(c.id),g=document.createElementNS(ns,'g'),circle=document.createElementNS(ns,'circle'),t=document.createElementNS(ns,'text');circle.setAttribute('cx',x);circle.setAttribute('cy',y);circle.setAttribute('r',14);circle.setAttribute('fill','#60a5fa');t.setAttribute('x',x+17);t.setAttribute('y',y);t.setAttribute('fill','white');t.setAttribute('font-size','10');t.textContent=(c.title||c.id).slice(0,24);g.append(circle,t);g.style.cursor='pointer';g.onclick=()=>show(c.id);svg.append(g);let b=el('button',c.title||c.id,$('graphlist'));b.onclick=()=>show(c.id)}}
$('find').onclick=()=>list($('q').value).catch(e=>alert(e.message));$('recent').onclick=()=>list().catch(e=>alert(e.message));$('network').onclick=()=>network().catch(e=>alert(e.message));list().catch(e=>el('p',e.message,$('results')));
</script></html>
